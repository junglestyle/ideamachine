[project]
name = "ideamachine"
version = "0.0.0"
description = "Turns Hearsay transcript segments into episodes and ideas."
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "numpy>=2",
    "anthropic>=0.70",
]

[project.optional-dependencies]
# The lattice's embeddings (`im run`'s matcher, the audits' probes): sentence-transformers on CPU-only torch. The tests
# don't need it: they embed with a hash.
models = [
    "torch>=2.8",
    "sentence-transformers>=5",
]

[project.scripts]
im = "im.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/im"]

[tool.pytest.ini_options]
testpaths = ["tests"]
