# Idea Machine on TrueNAS (install/nas.sh): Postgres, the pipeline run, and the web view.
# Hearsay's stream path and Postgres's loopback port come from install/.env, which install/nas.sh writes (the stream
# is on whichever pool Hearsay is on).
name: ideamachine

# Container output goes to the journal (on the boot pool), not to files on the data disks:
#   journalctl -t ideamachine-db, -t ideamachine-web
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  # Admin access: docker compose -f ... exec db psql -U postgres -d im
  db:
    image: pgvector/pgvector:pg16
    container_name: ideamachine-db
    logging: *logging
    # The apps user, like the other containers: the image's own postgres uid (999) is `netdata` on TrueNAS, which
    # would let the monitoring agent read the database files. The image supports any uid that owns the data dir.
    user: "568:568"
    env_file: /mnt/fast/ideamachine/config/db.env
    environment:
      POSTGRES_DB: im
    volumes:
      - /mnt/fast/ideamachine/pg:/var/lib/postgresql/data
      - ../dev/init:/docker-entrypoint-initdb.d:ro
    # The NAS's loopback only (DB_LOOPBACK_PORT in install/lib.sh, by way of install/.env): other programs on the box
    # read pub as role im_reader (docs/deploy.md). Never the LAN, never 0.0.0.0, never tailscale serve.
    ports:
      - "127.0.0.1:${DB_LOOPBACK_PORT:?no install/.env; run install/nas.sh}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "im"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # One `im` command per run: the TrueNAS cron job runs `run --rm run` hourly at :45; install/nas.sh uses it for
  # migrations and checks. Hearsay's stream is read-only here.
  run:
    build: ..
    image: ideamachine
    profiles: ["tools"]
    logging: *logging   # the cron job also sends this output to the journal, as -t ideamachine-run
    init: true   # forwards stop signals: Python as PID 1 ignores them
    user: "568:568"
    env_file: /mnt/fast/ideamachine/config/pipeline.env
    environment:
      IM_STREAM_DIR: /data/stream
      IM_CONFIG: /config/im.toml   # e.g. extract.prompt and the stages' models; made by install/nas.sh
      TZ: America/New_York   # payloads carry local times: keep them as they were on eeyore (im pending)
    volumes:
      - ${HEARSAY_STREAM:?no install/.env; run install/nas.sh}:/data/stream:ro
      - /mnt/fast/ideamachine/config/im:/config:ro
    depends_on:
      db:
        condition: service_healthy

  # The neutral view (src/im/web.py; decision 0007). Its own role and token, never the pipeline's. Loopback only:
  # tailscale serve publishes it to the tailnet over HTTPS. Never the LAN, never 0.0.0.0, never tailscale funnel:
  # quotes include other people's words.
  web:
    image: ideamachine   # built by install/nas.sh with the run service
    container_name: ideamachine-web
    logging: *logging
    init: true
    user: "568:568"
    env_file: /mnt/fast/ideamachine/config/web.env   # IM_WEB_DATABASE_URL, IM_WEB_TOKEN
    environment:
      TZ: America/New_York
    command: ["web", "--host", "0.0.0.0", "--port", "8792"]   # inside the container; the host port is loopback
    ports:
      - "127.0.0.1:8792:8792"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
