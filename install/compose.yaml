# Idea Machine on TrueNAS (install/nas.sh): Postgres, the hourly pipeline run, and Lattice.
name: ideamachine

services:
  # Internal only: no host port. Admin access: docker compose -f ... exec db psql -U postgres -d im
  db:
    image: pgvector/pgvector:pg16
    container_name: ideamachine-db
    # The apps user, like the other containers: the image's own postgres uid (999) is `netdata` on TrueNAS, which
    # would let the monitoring agent read the database files. The image supports any uid that owns the data dir.
    user: "568:568"
    env_file: /mnt/storage/ideamachine/config/db.env
    environment:
      POSTGRES_DB: im
    volumes:
      - /mnt/storage/ideamachine/pg:/var/lib/postgresql/data
      - ../dev/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "im"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # One `im` command per run: the TrueNAS cron job runs `run --rm run` hourly at :45; install/nas.sh uses it for
  # migrations and checks. Hearsay's stream is read-only here.
  run:
    build: ..
    image: ideamachine
    profiles: ["tools"]
    init: true   # forwards stop signals: Python as PID 1 ignores them
    user: "568:568"
    env_file: /mnt/storage/ideamachine/config/pipeline.env
    environment:
      IM_STREAM_DIR: /data/stream
      IM_CONFIG: /config/im.toml   # e.g. extract.prompt and extract.interests; made by install/nas.sh
      IM_VOCAB_PATH: /vocab/vocab.json   # my vocabulary, for Hearsay to read (src/im/vocab.py)
      TZ: America/New_York   # payloads carry local times: keep them as they were on eeyore (im pending)
    volumes:
      - /mnt/storage/hearsay/stream:/data/stream:ro
      - /mnt/storage/ideamachine/config/im:/config:ro
      - /mnt/storage/ideamachine/vocab:/vocab
    depends_on:
      db:
        condition: service_healthy

  # Loopback only: tailscale serve publishes the app (8790) to the tailnet over HTTPS. Never the LAN, never 0.0.0.0,
  # never tailscale funnel: evidence quotes include other people's words. The one exception is the MCP listener
  # (8791), which Lattice opens only when LATTICE_PUBLIC_URL is set: cloudflared publishes it to the internet for
  # claude.ai, behind OAuth and Anthropic's address range (Lattice's docs/public-mcp.md).
  lattice:
    build: /mnt/storage/ideamachine/lattice
    image: lattice
    container_name: lattice
    init: true
    user: "568:568"
    env_file: /mnt/storage/ideamachine/config/lattice.env
    environment:
      TZ: America/New_York
    ports:
      - "127.0.0.1:8790:8790"
      - "127.0.0.1:8791:8791"   # the public MCP listener; only cloudflared talks to it
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Publishes only Lattice's MCP listener (Lattice's docs/public-mcp.md). Outbound-only: opens no ports. Started by
  # install/nas.sh only when lattice.env sets LATTICE_PUBLIC_URL; the token is root-only.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: lattice-tunnel
    profiles: ["public"]
    command: tunnel --no-autoupdate run
    env_file: /mnt/storage/ideamachine/config/cloudflared.env   # TUNNEL_TOKEN=...
    network_mode: host   # to reach 127.0.0.1:8791
    restart: unless-stopped
