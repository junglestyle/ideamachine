<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Grid</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#070910">
<style>
/* The sky's night and the sky's colors: a star's hue is the direction of its card from the map's center (--hue). */
:root { --bg: #070910; --fg: #e8eaf2; --muted: #9aa0b4; --line: rgba(255, 255, 255, .09); --accent: #9db8ff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
header { padding: .8rem 1rem 0; }
header a { color: var(--fg); text-decoration: none; font-weight: 600; margin-right: 1rem; }
header a + a { font-weight: 400; color: var(--accent); margin-right: .8rem; }
#x { max-width: 92rem; margin: 0 auto; padding: 1rem 1rem 4rem; }
h1 { font-size: 1.5rem; margin: .6rem 0 .2rem; }
.lede { color: var(--muted); margin: 0 0 1.2rem; max-width: 52rem; text-wrap: pretty; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); }
section { background: var(--bg); padding: .5rem .7rem .8rem; min-width: 0; }
section:hover { background: #0c0f1a; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
line { stroke: rgba(170, 182, 230, .32); stroke-width: .5; }
circle { fill: hsl(var(--hue) 70% 86%); filter: drop-shadow(0 0 2.5px hsl(var(--hue) 80% 62%)); }
a:hover circle, a:focus circle { fill: #fff; stroke: #fff; stroke-width: 1.5; } svg a { outline: none; }
section b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600;
  line-height: 1.3; font-size: .9rem; }
section small { display: block; color: var(--muted); font-size: .76rem; }
section small a { color: var(--accent); text-decoration: none; margin-right: .8rem; }
@media (prefers-reduced-motion: no-preference) {
  /* The stars twinkle, each on its own beat. */
  circle { animation: twinkle 5s ease-in-out infinite; animation-delay: calc(var(--d) * -.7s); }
  @keyframes twinkle { 50% { opacity: .62; } }
}
</style>
<header><a href="/"><img src="/icon.svg" alt="" width="24" height="24" style="vertical-align: middle"> Idea Machine</a
><a href="/sky">Sky</a><a href="/trails">Trails</a><a href="/threads">Threads</a><a href="/tree">Tree</a></header>
<div id="x">{body}</div>
</html>
