<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Threads</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151a" media="(prefers-color-scheme: dark)">
<style>
/* A thread's color is the sky's: the direction of its middle from the map's center (--hue, set on each row). */
:root { --bg: #f6f4ef; --fg: #1d1d1f; --muted: #6b6b70; --line: #dcd8cf; --accent: #0a58ca; --l: 40%; --s: 55%; }
@media (prefers-color-scheme: dark) { :root { --bg: #14151a; --fg: #ececf0; --muted: #9a9aa6; --line: #2d2f38;
  --accent: #9db8ff; --l: 72%; --s: 60%; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
header { padding: .8rem 1rem 0; }
header a { color: var(--fg); text-decoration: none; font-weight: 600; margin-right: 1rem; }
header a + a { font-weight: 400; color: var(--accent); margin-right: .8rem; }
#x { max-width: 84rem; margin: 0 auto; padding: 1rem 1rem 4rem; }
h1 { font-size: 1.5rem; margin: .6rem 0 .2rem; }
.lede { color: var(--muted); margin: 0 0 1.2rem; max-width: 52rem; text-wrap: pretty; }
.months, summary { display: grid; grid-template-columns: minmax(0, 19rem) minmax(0, 1fr); gap: 0 1rem;
  align-items: center; }
.months svg, summary svg { grid-column: 2; grid-row: 1; width: 100%; height: 22px; display: block; overflow: visible; }
.months { position: sticky; top: 0; background: var(--bg); z-index: 1; padding: .3rem 0; }
.months line { stroke: var(--line); } .months text { fill: var(--muted); font-size: 10px; }
details { border-top: 1px solid var(--line); --ink: hsl(var(--hue) var(--s) var(--l)); }
summary { list-style: none; cursor: pointer; padding: .45rem 0; }
summary::-webkit-details-marker { display: none; }
summary:hover b, summary:focus-visible b { color: var(--accent); } summary:focus-visible { outline: none; }
summary span { min-width: 0; }
summary b { display: block; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
details[open] summary b { white-space: normal; }
summary small { color: var(--muted); font-size: .78rem; display: block; }
summary line { stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; opacity: .55; }
summary circle { fill: var(--ink); }
summary a:hover circle, summary a:focus circle { stroke: var(--fg); stroke-width: 1.5; }
summary a { outline: none; }
details ol { list-style: none; margin: 0 0 1rem; padding: 0 0 0 1rem; border-left: 2px solid var(--ink);
  max-width: 46rem; }
.on { margin: .2rem 0 .4rem 1rem; color: var(--muted); font-size: .86rem; }
.on a { color: var(--accent); text-decoration: none; margin-left: .5rem; }
details li { margin: .7rem 0; }
details li a { color: var(--fg); text-decoration: none; display: block; }
details li small { color: var(--muted); font-size: .78rem; display: block; }
details li b { display: block; line-height: 1.3; } details li a:hover b { color: var(--accent); }
details li q { color: var(--muted); font: .98rem/1.4 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
@media (max-width: 720px) {
  .months, summary { grid-template-columns: minmax(0, 1fr); }
  .months svg, summary svg { grid-column: 1; grid-row: 2; }
  .months span { display: none; } .months svg { grid-row: 1; }
}
</style>
<header><a href="/"><img src="/icon.svg" alt="" width="24" height="24" style="vertical-align: middle"> Idea Machine</a
><a href="/sky">Sky</a><a href="/trails">Trails</a><a href="/echoes">Echoes</a><a href="/apart">Apart</a><a href="/crossroads">Crossroads</a><a href="/grid">Grid</a></header>
<div id="x">{body}</div>
</html>
