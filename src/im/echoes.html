<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Echoes</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151a" media="(prefers-color-scheme: dark)">
<style>
/* A connection's kind is a color, here and on its arc: none (plain), elaborates, supports, tension. */
:root { --bg: #f6f4ef; --fg: #1d1d1f; --muted: #6b6b70; --line: #dcd8cf; --card: #fffdf8; --accent: #0a58ca;
  --plain: #8a8a92; --elaborates: #5a3fb5; --supports: #1f7a4d; --tension: #c2410c; }
@media (prefers-color-scheme: dark) { :root { --bg: #14151a; --fg: #ececf0; --muted: #9a9aa6; --line: #2d2f38;
  --card: #1b1d24; --accent: #9db8ff; --plain: #7d7f8c; --elaborates: #b7a3ff; --supports: #7fd1a0;
  --tension: #ff9a6b; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
header { padding: .8rem 1rem 0; }
header a { color: var(--fg); text-decoration: none; font-weight: 600; margin-right: 1rem; }
header a + a { font-weight: 400; color: var(--accent); margin-right: .8rem; }
#x { max-width: 72rem; margin: 0 auto; padding: 1rem 1rem 4rem; }
h1 { font-size: 1.5rem; margin: .6rem 0 .2rem; }
.lede { color: var(--muted); margin: 0 0 1rem; }
nav { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
nav span { width: 1.2rem; }
nav a { color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 999px;
  padding: .1rem .7rem; font-size: .9rem; }
nav a[aria-current] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
svg { display: block; width: 100%; height: auto; margin: 1rem 0 1.4rem; overflow: visible; }
svg path { fill: none; stroke: var(--plain); stroke-opacity: .3; stroke-width: 1; vector-effect: non-scaling-stroke; }
svg path.elaborates { stroke: var(--elaborates); stroke-opacity: .5; }
svg path.supports { stroke: var(--supports); stroke-opacity: .7; }
svg path.tension { stroke: var(--tension); stroke-opacity: .9; stroke-width: 1.5; }
svg a:hover path, svg a:focus path { stroke-opacity: 1; stroke-width: 2.5; }
svg a { outline: none; }
svg .axis, svg line { stroke: var(--line); vector-effect: non-scaling-stroke; }
svg text { fill: var(--muted); font-size: 11px; }
ol { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: minmax(0, 1fr) 9.5rem minmax(0, 1fr); gap: .3rem 1rem; align-items: center;
  padding: 1rem 0; border-top: 1px solid var(--line); scroll-margin-top: 1rem; }
li:target { background: color-mix(in srgb, var(--accent) 9%, transparent); box-shadow: 0 0 0 .6rem
  color-mix(in srgb, var(--accent) 9%, transparent); border-radius: 4px; }
.side { display: block; color: var(--fg); text-decoration: none; }
.side:first-child { text-align: right; }
.side small { display: block; color: var(--muted); font-size: .78rem; }
.side b { display: block; line-height: 1.3; }
.side:hover b, .side:focus-visible b { color: var(--accent); }
.side q { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  color: var(--muted); font: .98rem/1.4 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  margin-top: .15rem; }
.gap { text-align: center; color: var(--plain); position: relative; }
.gap::before, .gap::after { content: ""; position: absolute; top: .78rem; width: 1.1rem; border-top: 1px solid; }
.gap::before { left: 0; } .gap::after { right: 0; }
.gap b { display: block; font-size: 1.05rem; color: var(--fg); }
.gap small { display: block; font-size: .78rem; line-height: 1.3; }
li.elaborates .gap { color: var(--elaborates); } li.supports .gap { color: var(--supports); }
li.tension .gap { color: var(--tension); }
li p { grid-column: 1 / -1; margin: .2rem auto 0; max-width: 46rem; text-align: center; color: var(--muted);
  font-size: .86rem; text-wrap: pretty; }
li p::before { content: "The judge: "; opacity: .75; }
li p i { display: block; }
@media (max-width: 720px) {
  li { grid-template-columns: minmax(0, 1fr); }
  .side:first-child, .gap, li p { text-align: left; }
  .gap::before, .gap::after { display: none; }
  .gap b, .gap small { display: inline; } .gap small::before { content: " · "; }
  .gap { border-left: 2px solid; padding-left: .7rem; margin-left: .2rem; }
  li p { margin: .2rem 0 0; }
}
</style>
<header><a href="/"><img src="/icon.svg" alt="" width="24" height="24" style="vertical-align: middle"> Idea Machine</a
><a href="/sky">Sky</a><a href="/trails">Trails</a><a href="/crossroads">Crossroads</a></header>
<div id="x">{body}</div>
</html>
